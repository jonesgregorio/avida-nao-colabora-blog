name: Apply Supabase Migrations
on:
  push:
    branches: [main]
    paths:
      - 'kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/supabase/migrations/*.sql'
  workflow_dispatch: {}

# Aplicações no mesmo banco de produção são sequenciais: uma nova espera a
# anterior concluir e nunca cancela uma migration já iniciada.
concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: a validação compara o push inteiro, não apenas
          # o último commit, e precisa alcançar a revisão anterior da main.
          fetch-depth: 0

      - name: Resolver intervalo do push
        id: range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          HEAD_REF="$(git rev-parse HEAD)"
          BASE_REF=""
          if [ -n "${EVENT_BEFORE:-}" ] \
            && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify --quiet "$EVENT_BEFORE^{commit}" > /dev/null; then
            BASE_REF="$EVENT_BEFORE"
          elif git rev-parse --verify --quiet "HEAD^{commit}" > /dev/null \
            && git rev-parse --verify --quiet "HEAD^^{commit}" > /dev/null; then
            BASE_REF="$(git rev-parse HEAD^)"
          fi
          if [ -z "$BASE_REF" ]; then
            echo "Não foi possível determinar a revisão base; nada será aplicado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Intervalo: $BASE_REF..$HEAD_REF"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Validar diff de migrations
        if: steps.range.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x .github/scripts/validate-migrations.sh
          .github/scripts/validate-migrations.sh \
            "${{ steps.range.outputs.base }}" \
            "${{ steps.range.outputs.head }}" \
            "$RUNNER_TEMP/migrations-novas.txt"

      - name: Aplicar migrations novas (Management API)
        if: steps.range.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: lejvvhzluggyxlfwfoxl
        run: |
          set -euo pipefail
          LIST="$RUNNER_TEMP/migrations-novas.txt"
          if [ ! -s "$LIST" ]; then
            echo "Nenhuma migration nova para aplicar."
            exit 0
          fi
          # Ordem determinística: o prefixo do nome define a sequência.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "== $f =="
            payload=$(jq -n --rawfile q "$f" '{query:$q}')
            http=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "$payload")
            echo "HTTP $http"; cat resp.json; echo
            if [ "$http" -ge 300 ]; then
              echo "FALHOU: $f"
              exit 1
            fi
          done < <(sort "$LIST")
