name: Apply Part 2 Final Files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/questionnaire-emotional-signals'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/questionnaire-emotional-signals
          fetch-depth: 0
      - name: Detect completed implementation
        id: state
        run: |
          if grep -q "Questionários que complementam este mês" kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/src/components/MyEvolutionPage.tsx; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore validated patch from branch history
        if: steps.state.outputs.applied != 'true'
        run: |
          SOURCE_COMMIT="654dd98f81c434eb2bc38bf02ba175342e2d39f6"
          git show "$SOURCE_COMMIT:.github/part2.patch.gz.b64.1" > "$RUNNER_TEMP/part1.b64"
          git show "$SOURCE_COMMIT:.github/part2.patch.gz.b64.2" > "$RUNNER_TEMP/part2.b64"
          cat "$RUNNER_TEMP/part1.b64" "$RUNNER_TEMP/part2.b64" | base64 -d | gzip -d > "$RUNNER_TEMP/part2.patch"
      - name: Apply product files and validate privacy integration
        if: steps.state.outputs.applied != 'true'
        run: |
          APP_DIR="kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog"
          rm -f "$APP_DIR/tests/questionnaireEmotionalIntegration.test.ts"
          git apply --check --directory="$APP_DIR" "$RUNNER_TEMP/part2.patch"
          git apply --directory="$APP_DIR" "$RUNNER_TEMP/part2.patch"
          cd "$APP_DIR"
          node --experimental-strip-types --test tests/questionnaireEmotionalIntegration.test.ts
      - name: Commit validated implementation
        if: steps.state.outputs.applied != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/src/components/MyEvolutionPage.tsx
          git add kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/supabase/functions/run-emotional-automations/runner.ts
          git add kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/tests/questionnaireEmotionalIntegration.test.ts
          git commit -m "feat: integrar questionarios a inteligencia emocional"
          git push origin HEAD:feat/questionnaire-emotional-signals
