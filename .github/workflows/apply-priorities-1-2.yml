name: Apply priorities 1 and 2

on:
  push:
    branches:
      - avnc-priorities-1-2-publish
    paths:
      - .github/workflows/apply-priorities-1-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply audited patches
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/p1_00 .tmp/priority1.patch.gz.b64.01 .tmp/p1_02 .tmp/p1_03 .tmp/p1_04 > /tmp/p1.b64
          base64 -d /tmp/p1.b64 | gzip -dc > /tmp/priority1.patch
          git apply --check /tmp/priority1.patch
          git apply /tmp/priority1.patch

          cat .tmp/p2_00 .tmp/p2_01 > /tmp/p2.b64
          base64 -d /tmp/p2.b64 | gzip -dc > /tmp/priority2.patch
          git apply --check /tmp/priority2.patch
          git apply /tmp/priority2.patch

      - name: Remove staging files and commit clean tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f .github/workflows/apply-priorities-1-2.yml
          git config user.name "jonesgregorio"
          git config user.email "jonesgregory.jg@gmail.com"
          git add -A
          git commit -m "feat: complete priorities 1 and 2"
          git push origin HEAD:avnc-priorities-1-2-publish
