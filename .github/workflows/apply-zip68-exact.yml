name: Apply ZIP68 exact
on:
  push:
    branches: [publish-zip68-p0-p3-v2]
    paths: ['.github/workflows/apply-zip68-exact.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-zip68-p0-p3-v2
          fetch-depth: 0
      - name: Apply exact patches
        run: |
          set -euo pipefail
          for p in .tmp/zip68-01.patch .tmp/z02.patch .tmp/z03.patch .tmp/z04.patch .tmp/z05.patch .tmp/exact-z06.patch .tmp/exact-z07.patch .tmp/exact-z08.patch .tmp/exact-z10h2.patch .tmp/exact-z10h3.patch .tmp/exact-z10h4.patch .tmp/exact-z10h5.patch .tmp/exact-z11.patch; do
            echo "Checking $p"
            git apply --check "$p"
            git apply "$p"
          done
          rm -f avida-nao-colabora-producao.zip auto_push.log package-lock.json
          rm -f auto_push.ps1 check_and_push.ps1 commit_admin.bat commit_automation.bat commit_daily_widget.bat commit_fix.bat configurar_automacao.bat
          rm -f push_fix_app.bat push_fix_app2.bat push_fix_questionnaires.bat push_fix_truncados.bat push_fixes_008.bat push_fixes_009.bat registrar_auto_push.bat
          rm -f kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/.brand-tmp/PlayfairDisplay-Regular.ttf
          rm -rf .tmp .github/workflows/apply-zip68-exact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply ZIP68 P0-P3 hardening"
          git push origin publish-zip68-p0-p3-v2
# retrigger 2026-08-17T22:16-03:00
