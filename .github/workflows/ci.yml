name: CI

on:
  push:
    branches: [main]
    paths:
      - 'kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
    defaults:
      run:
        working-directory: kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Automated tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Critical Edge Functions typecheck (Deno)
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/run-automations/index.ts \
            supabase/functions/run-emotional-automations/index.ts \
            supabase/functions/export-user-data/index.ts \
            supabase/functions/delete-account/index.ts

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

  database-migrations:
    name: database-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local database
        run: supabase db start

      - name: Rebuild schema from migrations
        run: supabase db reset --local

      - name: Database lint
        run: supabase db lint --local --level error
