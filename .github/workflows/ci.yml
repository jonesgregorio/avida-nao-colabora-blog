name: CI

on:
  push:
    branches: [main]
    paths:
      - 'kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations-guard:
    name: migrations-guard
    # Barreira anterior ao merge: migration histórica não pode ser editada,
    # renomeada ou removida. O workflow de aplicação é a segunda barreira.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar diff de migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # merge-base evita acusar como "alteração do PR" o que já entrou na main.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          chmod +x .github/scripts/validate-migrations.sh
          .github/scripts/validate-migrations.sh "$MERGE_BASE" "$HEAD_SHA"

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
    defaults:
      run:
        working-directory: kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Automated tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Functions typecheck (Deno)
        run: |
          set -uo pipefail
          # Descobre TODAS as Edge Functions com index.ts em vez de manter uma
          # lista manual — uma função nova entra na checagem automaticamente.
          mapfile -t files < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhuma Edge Function encontrada em supabase/functions/*/index.ts."
            exit 1
          fi

          # Dívida de tipo conhecida e já documentada em
          # docs/EDGE_FUNCTIONS_TYPE_DEBT.md — todas ligadas ao Stripe, achadas
          # na primeira vez que o deno check rodou nelas (não são regressão
          # desta mudança). Falha aqui é aviso, não bloqueia o merge, para não
          # misturar correção de Stripe num PR de CI. Qualquer função NOVA ou
          # já saudável precisa continuar passando de verdade.
          known_broken=(
            "supabase/functions/manage-subscription/index.ts"
            "supabase/functions/resend-webhook/index.ts"
            "supabase/functions/stripe-audit/index.ts"
            "supabase/functions/stripe-selftest/index.ts"
            "supabase/functions/stripe-webhook/index.ts"
          )
          is_known_broken() {
            local target="$1"
            local candidate
            for candidate in "${known_broken[@]}"; do [ "$candidate" = "$target" ] && return 0; done
            return 1
          }

          echo "Verificando ${#files[@]} Edge Functions (${#known_broken[@]} com dívida de tipo conhecida — ver docs/EDGE_FUNCTIONS_TYPE_DEBT.md):"
          printf '  - %s\n' "${files[@]}"
          echo
          failed=()
          known_still_broken=()
          known_now_fixed=()
          for f in "${files[@]}"; do
            echo "== deno check $f =="
            if deno check --node-modules-dir=auto "$f"; then
              if is_known_broken "$f"; then
                known_now_fixed+=("$f")
              fi
            else
              if is_known_broken "$f"; then
                known_still_broken+=("$f")
                echo "(dívida conhecida — não bloqueia este PR, ver docs/EDGE_FUNCTIONS_TYPE_DEBT.md)"
              else
                failed+=("$f")
              fi
            fi
            echo
          done

          if [ "${#known_now_fixed[@]}" -gt 0 ]; then
            echo "AVISO: função(ões) da lista de dívida agora PASSAM no deno check — remova de known_broken neste workflow e de docs/EDGE_FUNCTIONS_TYPE_DEBT.md:"
            printf '  - %s\n' "${known_now_fixed[@]}"
            echo
          fi

          if [ "${#known_still_broken[@]}" -gt 0 ]; then
            echo "Dívida de tipo conhecida confirmada em ${#known_still_broken[@]} função(ões) (não bloqueia):"
            printf '  - %s\n' "${known_still_broken[@]}"
            echo
          fi

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "FALHOU em ${#failed[@]} função(ões) fora da lista de dívida conhecida:"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          if [ "${#known_still_broken[@]}" -gt 0 ]; then
            echo "OK: nenhuma função fora da lista de dívida conhecida falhou (${#known_still_broken[@]} com dívida documentada, ${#files[@]} verificadas)."
          else
            echo "Todas as ${#files[@]} Edge Functions passaram no deno check."
          fi

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
