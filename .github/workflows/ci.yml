name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: write

jobs:
  fix-final-deno-type:
    if: github.head_ref == 'publish-zip68-p0-p3-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-zip68-p0-p3-v2
          fetch-depth: 0
      - name: Fix implicit any in editorial title normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/supabase/functions/run-automations/index.ts')
          s = p.read_text()
          s = s.replace(
              'existingTitles.map(v => slugify(String(v)))',
              'existingTitles.map((v: unknown) => slugify(String(v)))',
          )
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/supabase/functions/run-automations/index.ts
          if git diff --cached --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git commit -m "fix: type editorial title normalization"
          git push origin publish-zip68-p0-p3-v2
