name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/supabase/functions/**'
      - 'kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O seletor compara github.event.before com github.sha. Sem o
          # histórico, o runner não conhece o commit anterior e não pode
          # calcular com segurança quais funções realmente mudaram.
          fetch-depth: 0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - name: Select changed Edge Functions
        id: changed-functions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -printf '%h\n' | xargs -r -n1 basename | sort > "$RUNNER_TEMP/edge-functions-to-deploy.txt"
          else
            node "$GITHUB_WORKSPACE/.github/scripts/select-edge-functions-to-deploy.mjs" "$BEFORE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/edge-functions-to-deploy.txt"
          fi
          echo "count=$(wc -l < "$RUNNER_TEMP/edge-functions-to-deploy.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Deploy changed Edge Functions
        if: steps.changed-functions.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          while IFS= read -r function_name; do
            echo "Deploying $function_name"
            supabase functions deploy "$function_name" --project-ref lejvvhzluggyxlfwfoxl
          done < "$RUNNER_TEMP/edge-functions-to-deploy.txt"

      - name: Report no Edge Functions changed
        if: steps.changed-functions.outputs.count == '0'
        run: echo "Nenhuma Edge Function mudou; nenhum deploy foi necessário."
