name: Fix Priority 3 lint residue

on:
  push:
    branches: [priority3-robustez-validation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: priority3-robustez-validation
      - name: Remove unused legacy variable and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/supabase/functions/run-automations/index.ts')
          s = p.read_text()
          s = s.replace("      const tipo = 'article'\n", '')
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-priority3-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove unused automation variable'
            git push origin HEAD:priority3-robustez-validation
          fi
