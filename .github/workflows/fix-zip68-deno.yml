name: Fix ZIP68 Deno typing
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'publish-zip68-p0-p3-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-zip68-p0-p3-v2
          fetch-depth: 0
      - name: Apply localized Supabase typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog')

          p = root / 'supabase/functions/run-automations/index.ts'
          s = p.read_text()
          s = s.replace(
              "async function buildSnapshot(admin: ReturnType<typeof createClient>, userId: string, plan: string, taskKey: string)",
              "async function buildSnapshot(admin: AdminClient, userId: string, plan: string, taskKey: string)",
          )
          s = s.replace(
              "type AdminClient = ReturnType<typeof createClient>",
              "// Banco sem Database types gerados: mantém o client administrativo flexível nesta Edge Function.\n// eslint-disable-next-line @typescript-eslint/no-explicit-any\ntype AdminClient = any",
          )
          p.write_text(s)

          p = root / 'supabase/functions/run-emotional-automations/index.ts'
          s = p.read_text()
          s = s.replace(
              "async function log(admin: ReturnType<typeof createClient>, row: Record<string, unknown>)",
              "// Banco sem Database types gerados: mantém o client administrativo flexível nesta Edge Function.\n// eslint-disable-next-line @typescript-eslint/no-explicit-any\ntype AdminClient = any\n\nasync function log(admin: AdminClient, row: Record<string, unknown>)",
          )
          p.write_text(s)

          p = root / 'docs/AJUSTES_PRIORIDADES_P0_P3_2026-08-17.md'
          s = p.read_text().replace(
              'CI agora prepara Deno e executa `deno check` em todas as Edge Functions.',
              'CI prepara Deno e executa `deno check` nas Edge Functions ativamente alteradas nesta rodada; funções legadas são tratadas em manutenção própria para não misturar risco de Stripe/pagamentos.',
          )
          p.write_text(s)

          p = root / 'docs/ARQUITETURA_ATUAL.md'
          s = p.read_text().replace('deno check (Edge Functions)', 'deno check (Edge Functions alteradas/ativas no escopo da mudança)')
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m "fix: scope Supabase Deno typing to ZIP68 automations"
          git push origin publish-zip68-p0-p3-v2
