name: Temporary My Plan info update
on:
  push:
    branches: [chatgpt/my-plan-current-features]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/my-plan-current-features
      - name: Update My Plan info UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/src/components/MyPlanPageCore.tsx')
          s = p.read_text()
          s = s.replace("import { Check, Crown, Loader2, AlertTriangle, ArrowUp, ArrowDown, X, ShieldCheck, Sprout, Leaf } from 'lucide-react'", "import { Check, Crown, Loader2, AlertTriangle, ArrowUp, ArrowDown, X, ShieldCheck, Sprout, Leaf, Info } from 'lucide-react'")
          needle = "  const [reasonError, setReasonError] = useState<string | null>(null)"
          s = s.replace(needle, needle + "\n  const [infoBenefit, setInfoBenefit] = useState<CatalogBenefitView | null>(null)")
          old = '''                  <span>\n                    <strong className="font-medium">{item.label}</strong>\n                    {item.description ? <span className="block text-ink-soft mt-0.5">{item.description}</span> : null}\n                  </span>'''
          new = '''                  <div className="min-w-0 flex items-center gap-1.5">\n                    <strong className="font-medium">{item.label}</strong>\n                    {item.description ? (\n                      <button type="button" onClick={() => setInfoBenefit(item)} className="inline-flex items-center justify-center text-ink-soft hover:text-forest-800 transition-colors flex-shrink-0" aria-label={`Saiba mais sobre ${item.label}`}>\n                        <Info className="w-3.5 h-3.5" />\n                      </button>\n                    ) : null}\n                  </div>'''
          if old not in s:
              raise SystemExit('benefit block not found')
          s = s.replace(old, new)
          marker = "\n    </div>\n  )\n}\n"
          modal = '''\n      {infoBenefit && (\n        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" role="dialog" aria-modal="true" aria-label={`Informações sobre ${infoBenefit.label}`}>\n          <button type="button" className="absolute inset-0 bg-forest-950/35 backdrop-blur-[2px]" onClick={() => setInfoBenefit(null)} aria-label="Fechar informações" />\n          <div className="relative w-full sm:max-w-md rounded-t-[28px] sm:rounded-[28px] border border-line bg-paper shadow-2xl p-6 sm:p-7">\n            <button type="button" onClick={() => setInfoBenefit(null)} className="absolute right-5 top-5 w-8 h-8 rounded-full hover:bg-mint/60 inline-flex items-center justify-center text-ink-soft hover:text-forest-900" aria-label="Fechar"><X className="w-4 h-4" /></button>\n            <div className="w-10 h-10 rounded-xl bg-mint flex items-center justify-center text-forest-700 mb-4"><Info className="w-5 h-5" /></div>\n            <h3 className="font-serif text-2xl text-forest-950 pr-10">{infoBenefit.label}</h3>\n            <p className="mt-4 text-sm leading-relaxed text-ink-soft">{infoBenefit.description}</p>\n          </div>\n        </div>\n      )}\n'''
          if marker not in s:
              raise SystemExit('root marker not found')
          head, tail = s.rsplit(marker, 1)
          s = head + modal + marker + tail
          p.write_text(s)
          PY
          rm .github/workflows/temp-my-plan-info.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog/src/components/MyPlanPageCore.tsx .github/workflows/temp-my-plan-info.yml
          git commit -m "Atualizar funcionalidades e detalhes da aba Meu Plano"
          git push origin HEAD:chatgpt/my-plan-current-features
