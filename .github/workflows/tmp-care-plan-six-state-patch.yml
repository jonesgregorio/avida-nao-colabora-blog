name: Temporary Care Plan Six-State Patch

on:
  push:
    branches:
      - feat/care-plan-feedback-six-states-2026-09-13
    paths:
      - .github/workflows/tmp-care-plan-six-state-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/care-plan-feedback-six-states-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch seguro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('kind-lucid-clarke/mnt/outputs/avida-nao-colabora-blog')
          runner_path = root / 'supabase/functions/run-emotional-automations/runner.ts'
          contracts_path = root / 'supabase/functions/_shared/emotionalPromptContracts.ts'
          test_path = root / 'tests/carePlanActionFeedback.test.ts'

          runner = runner_path.read_text()

          old_types = """type CarePlanFeedbackValue = 'helpful' | 'later' | 'not_for_me'\ntype CarePlanFeedbackEntry = {\n  action: string\n  feedback: CarePlanFeedbackValue\n}\n"""
          new_types = """type CarePlanFeedbackValue =\n  | 'helped'\n  | 'neutral'\n  | 'not_tried'\n  | 'could_not'\n  | 'adapt'\n  | 'not_for_me'\n  | 'helpful'\n  | 'later'\ntype CarePlanFeedbackEntry = {\n  action: string\n  feedback: CarePlanFeedbackValue\n  adapted_action?: string | null\n  state?: 'active' | 'considering' | 'paused' | 'removed'\n  source: 'living' | 'legacy'\n}\n"""
          if old_types not in runner:
              raise SystemExit('Bloco de tipos de feedback não encontrado')
          runner = runner.replace(old_types, new_types, 1)

          old_prompt = """  const feedbackContext = kind === 'self_care_plan' && careFeedback.length\n    ? ` Considere também estas percepções opcionais sobre ações do roteiro anterior: ${JSON.stringify(careFeedback)}. Interprete helpful apenas como \"fez sentido\" e use isso para inspirar ações semelhantes sem assumir eficácia. Interprete later como \"talvez depois\": adapte intensidade ou momento, sem tratar como recusa. Interprete not_for_me como \"não combinou comigo\": evite repetir a mesma ação ou uma formulação praticamente idêntica e escolha outra abordagem. Essas percepções não são progresso, conclusão, diagnóstico ou prova de melhora. Não mencione mecanismo de feedback, pontuação, sistema interno ou bastidores na resposta.`\n    : ''\n"""
          new_prompt = """  const feedbackContext = kind === 'self_care_plan' && careFeedback.length\n    ? ` Considere também estas percepções opcionais sobre ações do Plano de Autocuidado anterior: ${JSON.stringify(careFeedback)}. Trate cada retorno como preferência contextual, nunca como prova de eficácia, adesão ou melhora. Para feedback=helped, a ação pareceu útil à pessoa: você pode se inspirar na abordagem, sem prometer o mesmo resultado. Para feedback=neutral, houve pouco efeito: reduza a prioridade de uma repetição idêntica e considere outra abordagem. Para feedback=not_tried, não houve experiência suficiente: não conclua se a ação combina ou não; só reapresente se os dados atuais justificarem, de preferência de modo simples. Para feedback=could_not, a ação ficou difícil naquele momento: diminua duração, esforço, etapas ou exigência e ofereça uma versão mínima. Para feedback=adapt, priorize adapted_action quando existir como sinal explícito de preferência e use a direção dessa adaptação para tornar a nova ação mais realista. Para feedback=not_for_me, evite repetir a mesma ação ou formulação quase idêntica e escolha outra abordagem. Em registros legados, helpful equivale a uma percepção positiva e later apenas indica que vale adaptar intensidade ou momento. Se state estiver paused ou removed, respeite essa decisão e não trate a ação como ativa. Essas percepções não são progresso, conclusão, diagnóstico ou prova de melhora. Não mencione mecanismo de feedback, pontuação, sistema interno ou bastidores na resposta.`\n    : ''\n"""
          if old_prompt not in runner:
              raise SystemExit('Bloco do prompt de feedback não encontrado')
          runner = runner.replace(old_prompt, new_prompt, 1)

          old_loader = """async function loadPreviousCarePlanFeedback(admin: AdminClient, userId: string, beforeStart: string): Promise<CarePlanFeedbackEntry[]> {\n  // Usa somente o roteiro anterior já enviado e a escolha estruturada do usuário.\n  // Falha aberta: se a migration ainda não tiver chegado ao banco durante deploy,\n  // a automação continua gerando o plano sem esse contexto opcional.\n  const { data: previous, error: previousError } = await admin\n    .from('monthly_care_plans')\n    .select('id,care_plan,period_end')\n    .eq('user_id', userId)\n    .eq('status', 'sent')\n    .lt('period_end', beforeStart)\n    .order('period_end', { ascending: false })\n    .limit(1)\n    .maybeSingle()\n  if (previousError || !previous) return []\n\n  const carePlan = previous.care_plan && typeof previous.care_plan === 'object'\n    ? previous.care_plan as Record<string, unknown>\n    : {}\n  const actions = texts(carePlan.suggested_micro_actions ?? carePlan.practical_tips, 260)\n  if (!actions.length) return []\n\n  const { data: rows, error: feedbackError } = await admin\n    .from('care_plan_action_feedback')\n    .select('action_index,feedback')\n    .eq('user_id', userId)\n    .eq('care_plan_id', previous.id)\n  if (feedbackError || !rows?.length) return []\n\n  const allowed = new Set<CarePlanFeedbackValue>(['helpful', 'later', 'not_for_me'])\n  return rows.flatMap((row: Record<string, unknown>) => {\n    const actionIndex = Number(row.action_index)\n    const feedback = String(row.feedback || '') as CarePlanFeedbackValue\n    if (!Number.isInteger(actionIndex) || actionIndex < 0 || actionIndex >= actions.length || !allowed.has(feedback)) return []\n    return [{ action: actions[actionIndex], feedback }]\n  }).slice(0, 5)\n}\n\nfunction careFeedbackSummary(items: CarePlanFeedbackEntry[]) {\n  return {\n    total: items.length,\n    helpful: items.filter(item => item.feedback === 'helpful').length,\n    later: items.filter(item => item.feedback === 'later').length,\n    not_for_me: items.filter(item => item.feedback === 'not_for_me').length,\n  }\n}\n"""
          new_loader = """async function loadPreviousCarePlanFeedback(admin: AdminClient, userId: string, beforeStart: string): Promise<CarePlanFeedbackEntry[]> {\n  // Usa apenas o Plano de Autocuidado anterior já enviado. O caminho principal lê\n  // o estado vivo da ação, porque ele preserva as seis respostas atuais e a versão\n  // adaptada escrita explicitamente pela pessoa. Nenhum texto livre do Diário entra\n  // aqui. Se a tabela viva não estiver disponível, mantém compatibilidade com o\n  // feedback legado de três estados sem bloquear a geração mensal.\n  const { data: previous, error: previousError } = await admin\n    .from('monthly_care_plans')\n    .select('id,care_plan,period_end')\n    .eq('user_id', userId)\n    .eq('status', 'sent')\n    .lt('period_end', beforeStart)\n    .order('period_end', { ascending: false })\n    .limit(1)\n    .maybeSingle()\n  if (previousError || !previous) return []\n\n  const allowedLiving = new Set<CarePlanFeedbackValue>(['helped', 'neutral', 'not_tried', 'could_not', 'adapt', 'not_for_me'])\n  const allowedStates = new Set(['active', 'considering', 'paused', 'removed'])\n  const { data: livingRows, error: livingError } = await admin\n    .from('care_plan_action_state')\n    .select('action_key,action_text,state,outcome,adapted_text,updated_at')\n    .eq('user_id', userId)\n    .eq('care_plan_id', previous.id)\n    .order('updated_at', { ascending: false })\n    .limit(20)\n\n  if (!livingError && livingRows?.length) {\n    const living = livingRows.flatMap((row: Record<string, unknown>) => {\n      const action = typeof row.action_text === 'string' ? row.action_text.trim().slice(0, 260) : ''\n      const feedback = String(row.outcome || '') as CarePlanFeedbackValue\n      const state = String(row.state || '')\n      if (!action || !allowedLiving.has(feedback)) return []\n      const adapted = typeof row.adapted_text === 'string' ? row.adapted_text.trim().slice(0, 260) : ''\n      return [{\n        action,\n        feedback,\n        adapted_action: adapted || null,\n        state: allowedStates.has(state) ? state as CarePlanFeedbackEntry['state'] : undefined,\n        source: 'living' as const,\n      }]\n    })\n    if (living.length) return living.slice(0, 12)\n  }\n\n  // Compatibilidade para planos antigos, anteriores ao estado vivo.\n  const carePlan = previous.care_plan && typeof previous.care_plan === 'object'\n    ? previous.care_plan as Record<string, unknown>\n    : {}\n  const actions = texts(carePlan.suggested_micro_actions ?? carePlan.practical_tips, 260)\n  if (!actions.length) return []\n\n  const { data: rows, error: feedbackError } = await admin\n    .from('care_plan_action_feedback')\n    .select('action_index,feedback')\n    .eq('user_id', userId)\n    .eq('care_plan_id', previous.id)\n  if (feedbackError || !rows?.length) return []\n\n  const allowedLegacy = new Set<CarePlanFeedbackValue>(['helpful', 'later', 'not_for_me'])\n  return rows.flatMap((row: Record<string, unknown>) => {\n    const actionIndex = Number(row.action_index)\n    const feedback = String(row.feedback || '') as CarePlanFeedbackValue\n    if (!Number.isInteger(actionIndex) || actionIndex < 0 || actionIndex >= actions.length || !allowedLegacy.has(feedback)) return []\n    return [{ action: actions[actionIndex], feedback, source: 'legacy' as const }]\n  }).slice(0, 5)\n}\n\nfunction careFeedbackSummary(items: CarePlanFeedbackEntry[]) {\n  return {\n    total: items.length,\n    helped: items.filter(item => item.feedback === 'helped' || item.feedback === 'helpful').length,\n    neutral: items.filter(item => item.feedback === 'neutral').length,\n    not_tried: items.filter(item => item.feedback === 'not_tried').length,\n    could_not: items.filter(item => item.feedback === 'could_not').length,\n    adapt: items.filter(item => item.feedback === 'adapt').length,\n    not_for_me: items.filter(item => item.feedback === 'not_for_me').length,\n    legacy_later: items.filter(item => item.feedback === 'later').length,\n    adapted_actions: items.filter(item => Boolean(item.adapted_action)).length,\n  }\n}\n"""
          if old_loader not in runner:
              raise SystemExit('Bloco do carregador de feedback não encontrado')
          runner = runner.replace(old_loader, new_loader, 1)
          runner_path.write_text(runner)

          contracts = contracts_path.read_text()
          if "self_care_plan: 'self_care_plan_v3'" not in contracts:
              raise SystemExit('Versão v3 do prompt não encontrada')
          contracts = contracts.replace("self_care_plan: 'self_care_plan_v3'", "self_care_plan: 'self_care_plan_v4'", 1)
          contracts_path.write_text(contracts)

          test_path.write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\n\nconst read = (path: string) => readFileSync(new URL(`../${path}`, import.meta.url), 'utf8')\nconst migration = read('supabase/migrations/20260828013500_care_plan_action_feedback.sql')\nconst livingMigration = read('supabase/migrations/20260908211000_living_self_care_plan.sql')\nconst grantFix = read('supabase/migrations/20260828015000_care_plan_feedback_minimum_grants.sql')\nconst component = read('src/components/CarePlanActionFeedback.tsx')\nconst page = read('src/components/SelfCarePlanPageLegacy.tsx')\nconst runner = read('supabase/functions/run-emotional-automations/runner.ts')\nconst contracts = read('supabase/functions/_shared/emotionalPromptContracts.ts')\n\ntest('feedback por ação continua estruturado, reversível e não representa conclusão', () => {\n  assert.match(migration, /CREATE TABLE IF NOT EXISTS public\\.care_plan_action_feedback/)\n  assert.match(migration, /feedback IN \\('helpful', 'later', 'not_for_me'\\)/)\n  assert.match(livingMigration, /outcome IN \\('helped','neutral','not_tried','could_not','adapt','not_for_me'\\)/)\n  assert.match(livingMigration, /adapted_text text/)\n  assert.match(component, /Fez sentido/)\n  assert.match(component, /Talvez depois/)\n  assert.match(component, /Não combinou comigo/)\n  assert.match(component, /aria-pressed=/)\n  assert.match(component, /\\.upsert\\(/)\n  assert.match(component, /\\.delete\\(\\)/)\n  assert.match(component, /Não há meta, pontuação ou sequência\\./)\n  assert.doesNotMatch(component, /\\bsetScore\\b|\\bsetPoints\\b|\\bsetStreak\\b|\\bsetCompleted\\b/)\n})\n\ntest('RLS limita feedback ao próprio plano enviado e mantém administração separada', () => {\n  assert.match(migration, /ALTER TABLE public\\.care_plan_action_feedback ENABLE ROW LEVEL SECURITY/)\n  assert.match(livingMigration, /ALTER TABLE public\\.care_plan_action_state ENABLE ROW LEVEL SECURITY/)\n  assert.match(livingMigration, /p\\.status = 'sent'/)\n  assert.match(migration, /care_plan_feedback_admin_all/)\n  assert.match(migration, /REVOKE ALL ON public\\.care_plan_action_feedback FROM anon/)\n})\n\ntest('authenticated recebe somente operações CRUD necessárias na tabela legada de feedback', () => {\n  assert.match(grantFix, /REVOKE ALL ON public\\.care_plan_action_feedback FROM authenticated/)\n  assert.match(grantFix, /GRANT SELECT, INSERT, UPDATE, DELETE ON public\\.care_plan_action_feedback TO authenticated/)\n  assert.match(grantFix, /REVOKE ALL ON public\\.care_plan_action_feedback FROM anon/)\n  assert.doesNotMatch(grantFix, /GRANT[^\\n]*(TRUNCATE|TRIGGER|REFERENCES)[^\\n]*authenticated/)\n})\n\ntest('Plano de Autocuidado legado mantém compatibilidade com o componente de percepção', () => {\n  assert.match(page, /import CarePlanActionFeedback from '.\\/CarePlanActionFeedback'/)\n  assert.match(page, /<CarePlanActionFeedback userId=\\{userId\\} carePlanId=\\{plan\\.id\\} actions=\\{microActions\\}/)\n})\n\ntest('próximo Plano de Autocuidado lê primeiro os seis retornos do estado vivo', () => {\n  assert.match(runner, /loadPreviousCarePlanFeedback/)\n  assert.match(runner, /\\.from\\('monthly_care_plans'\\)[\\s\\S]*\\.eq\\('status', 'sent'\\)[\\s\\S]*\\.lt\\('period_end', beforeStart\\)/)\n  assert.match(runner, /\\.from\\('care_plan_action_state'\\)[\\s\\S]*\\.select\\('action_key,action_text,state,outcome,adapted_text,updated_at'\\)/)\n  assert.match(runner, /\['helped', 'neutral', 'not_tried', 'could_not', 'adapt', 'not_for_me'\]/)\n  assert.match(runner, /adapted_action: adapted \\|\\| null/)\n  assert.match(runner, /source: 'living'/)\n  assert.match(runner, /prompt\\('self_care_plan', s, previousCareFeedback\\)/)\n  assert.match(runner, /previous_care_action_feedback: careFeedbackSummary\\(previousCareFeedback\\)/)\n})\n\ntest('feedback legado permanece como fallback sem bloquear a automação mensal', () => {\n  assert.match(runner, /Compatibilidade para planos antigos/)\n  assert.match(runner, /\\.from\\('care_plan_action_feedback'\\)[\\s\\S]*\\.select\\('action_index,feedback'\\)/)\n  assert.match(runner, /source: 'legacy'/)\n})\n\ntest('prompt v4 diferencia as seis respostas sem tratar percepção como eficácia', () => {\n  assert.match(contracts, /self_care_plan: 'self_care_plan_v4'/)\n  assert.match(runner, /feedback=helped/)\n  assert.match(runner, /feedback=neutral/)\n  assert.match(runner, /feedback=not_tried/)\n  assert.match(runner, /feedback=could_not/)\n  assert.match(runner, /feedback=adapt/)\n  assert.match(runner, /feedback=not_for_me/)\n  assert.match(runner, /priorize adapted_action/)\n  assert.match(runner, /não são progresso, conclusão, diagnóstico ou prova de melhora/)\n  assert.match(runner, /Não mencione mecanismo de feedback, pontuação, sistema interno ou bastidores/)\n})\n\ntest('resumo interno preserva contagens sem armazenar o texto adaptado', () => {\n  assert.match(runner, /adapted_actions: items\\.filter\\(item => Boolean\\(item\\.adapted_action\\)\\)\\.length/)\n  assert.doesNotMatch(runner, /previous_care_action_feedback:\\s*previousCareFeedback/)\n})\n""")
          PY

          rm .github/workflows/tmp-care-plan-six-state-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(care): preserva seis retornos no próximo ciclo"
          git push origin HEAD:feat/care-plan-feedback-six-states-2026-09-13
